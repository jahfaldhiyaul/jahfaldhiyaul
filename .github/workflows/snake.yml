name: Generate Animation

on:
  # Jalankan secara otomatis setiap 24 jam
  schedule:
    - cron: "0 0 * * *"
  
  # Bisa juga dijalankan secara manual dari tab Actions
  workflow_dispatch:
  
  # Jalankan setiap ada push ke branch main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: jahfaldhiyaul
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push generated output to branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write



permissions:
  contents: writpermissions:
  contents: wri
