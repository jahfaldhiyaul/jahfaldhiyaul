name: Generate Animation

on:
  # Jalankan secara otomatis setiap 24 jam
  schedule:
    - cron: "0 0 * * *" 
  
  # Bisa juga dijalankan secara manual dari tab Actions
  workflow_dispatch:
  
  # Jalankan setiap ada push ke branch main
  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Generate file animasi ular (Snake)
      - name: Generate contribution grid snake animation
        uses: Platane/snk/svg@v3
        id: snake-svg
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # 3. Push file SVG hasil generate ke branch khusus (misal: output)
      - name: Push snake animation to github page
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
